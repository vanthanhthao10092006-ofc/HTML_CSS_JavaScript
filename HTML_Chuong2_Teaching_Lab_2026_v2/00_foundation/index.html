<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Level 00 - HTML Foundation</title>
</head>
<body>
  <h1>HTML Foundation</h1>

  <!-- 1. ELEMENT -->
  <p>Element thường gồm opening tag + content + closing tag.</p>

  <!-- 2. ATTRIBUTE -->
  <p>
    <a href="https://developer.mozilla.org/">MDN Web Docs</a>
  </p>

  <!-- 3. NESTING: mở sau đóng trước -->
  <p>Tôi học <strong><em>HTML có cấu trúc</em></strong>.</p>

  <!-- 4. VOID ELEMENT -->
  <hr>
  <p>Trên đây là một thẻ hr không có closing tag.</p>
</body>
</html>
