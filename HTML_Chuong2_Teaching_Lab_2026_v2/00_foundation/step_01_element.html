<body>
  <!--
    Một element phổ biến có 3 phần:
    1) opening tag: <p>
    2) content: Xin chào lớp Web
    3) closing tag: </p>
  -->
  <p>Xin chào lớp Web.</p>

  <!-- THỬ NGAY: đổi nội dung giữa <p> và </p>. -->
</body>
