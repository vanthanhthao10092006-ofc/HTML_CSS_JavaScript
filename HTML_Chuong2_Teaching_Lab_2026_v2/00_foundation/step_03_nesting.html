<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>00.3 - Nesting</title>
</head>
<body>
  <!--
    Nesting = đặt element bên trong element khác.

    MẸO NHỚ:
    MỞ SAU → ĐÓNG TRƯỚC.

    p mở
      strong mở
        em mở
        em đóng
      strong đóng
    p đóng
  -->
  <p>Tôi đang học <strong><em>HTML rất nghiêm túc</em></strong>.</p>

  <!-- THỬ NGAY:
    Di chuyển </strong> ra trước </em> và quan sát code trở nên sai logic nesting thế nào.
    Sau đó sửa lại.
  -->
</body>
</html>
