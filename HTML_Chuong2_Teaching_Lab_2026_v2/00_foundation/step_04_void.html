<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>00.4 - Void elements</title>
</head>
<body>
  <h1>Void element</h1>

  <!-- hr không bọc content, nên không có closing tag -->
  <hr>

  <p>Dòng một.<br>Dòng hai.</p>

  <!--
    img cũng là void element.
    src: nguồn ảnh.
    alt: mô tả hữu ích của ảnh trong ngữ cảnh.
  -->
  <img src="../assets/sample.svg" alt="Ảnh minh họa kích thước 320 x 180">
</body>
</html>
