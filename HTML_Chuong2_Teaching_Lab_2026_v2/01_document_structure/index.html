<!doctype html>
<!-- lang nói ngôn ngữ chính của tài liệu -->
<html lang="vi">
<head>
  <!-- UTF-8 giúp hiển thị tiếng Việt đúng -->
  <meta charset="utf-8">

  <!-- viewport giúp layout hiển thị hợp lý trên mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- title là tên tài liệu/tab, không phải h1 -->
  <title>My First Complete HTML Page</title>
</head>
<body>
  <!-- body chứa nội dung chính người dùng nhìn thấy -->
  <h1>Trang HTML hoàn chỉnh đầu tiên</h1>
  <p>Tôi đã nhớ bộ xương HTML.</p>
</body>
</html>
