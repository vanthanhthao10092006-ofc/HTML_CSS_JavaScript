<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>02.3 - Links</title></head>
<body>
  <h1>Links</h1>

  <!-- Link ngoài -->
  <p><a href="https://developer.mozilla.org/">Đọc MDN Web Docs</a></p>

  <!-- Fragment link trong trang -->
  <p><a href="#contact">Đi tới phần liên hệ</a></p>

  <!-- Email -->
  <p><a href="mailto:webclass@example.com">Gửi email cho lớp Web</a></p>

  <section id="contact">
    <h2>Liên hệ</h2>
    <p>Đây là đích của href="#contact".</p>
  </section>
</body>
</html>
