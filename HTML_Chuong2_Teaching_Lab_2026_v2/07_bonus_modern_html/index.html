<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern HTML Bonus</title>
</head>
<body>
  <header>
    <h1>Modern HTML Bonus</h1>
  </header>

  <main>
    <section>
      <h2>Figure + caption</h2>
      <figure>
        <img src="../assets/sample.svg" alt="Ảnh placeholder minh họa dashboard sản phẩm">
        <figcaption>Dashboard demo của sản phẩm.</figcaption>
      </figure>
    </section>

    <section>
      <h2>Machine-readable time</h2>
      <p>Demo diễn ra ngày <time datetime="2026-09-20">20/09/2026</time>.</p>
    </section>

    <section>
      <h2>FAQ không cần JavaScript</h2>
      <details>
        <summary>HTML có tạo phần đóng/mở được không?</summary>
        <p>Có. `details` và `summary` cung cấp hành vi cơ bản ngay từ HTML.</p>
      </details>
    </section>

    <section>
      <h2>Hiển thị code</h2>
      <p>Tên file thường là <code>index.html</code>.</p>
      <pre><code>&lt;h1&gt;Hello HTML&lt;/h1&gt;</code></pre>
    </section>
  </main>
</body>
</html>
