<div class="flex flex-col items-center text-center mb-space-xl">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center p-space-xs shadow-sm mb-space-md">
<img alt="Logo Việc học của tôi" class="w-full h-full object-contain rounded-DEFAULT" src="https://lh3.googleusercontent.com/aida/AEtjO1XpYXil13qg8eA2nPhEmoQvPgmZ2yjtFRtS6ppDwA-NSVZXWl7Xkw1UtoBWJiSLyC0CCQyoTefw8KDJBQi9ZOq5tPdHX9E3j49CHlbSrq5hJM_52QQEDoGenNHQxwdO5_FRdoE1pffVuSqHLquFuxEqh2IdVufbFggLkpS66r67I3vHWpnD2aPkB8TAdPIUupmzBP3rEmvSQ1orLESSN6wnM3pJ9TWHgZMc3F8eOTiexJw-w4FywtkMrrYu"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs tracking-tight">
      Việc học của tôi
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
      Đăng nhập để theo dõi và hoàn thành bài tập của bạn
    </p>
</div>
<form class="flex flex-col gap-space-lg w-full" id="loginForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface font-medium flex items-center gap-space-xs" for="studentEmail">
<span class="material-symbols-outlined text-[18px] text-outline">alternate_email</span>
        Email học tập / Sinh viên
      </label>
<div class="relative">
<input class="w-full h-12 px-space-md bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#2563eb] transition-all" id="studentEmail" placeholder="vidu@sinhvien.edu.vn" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface font-medium flex items-center gap-space-xs" for="studentPassword">
<span class="material-symbols-outlined text-[18px] text-outline">lock</span>
        Mật khẩu
      </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-space-md pr-12 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#2563eb] transition-all tracking-wider" id="studentPassword" placeholder="••••••••" required="" type="password"/>
<button aria-label="Ẩn hiện mật khẩu" class="absolute right-0 pr-space-md h-full flex items-center justify-center text-outline hover:text-on-surface focus:outline-none transition-colors" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between text-left select-none pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer group">
<input class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 rounded-[6px] bg-surface-container flex items-center justify-center peer-checked:bg-primary-container text-white transition-all shadow-sm">
<span class="material-symbols-outlined text-[16px] scale-0 peer-checked:scale-100 transition-transform font-bold">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">
          Ghi nhớ đăng nhập
        </span>
</label>
<a class="font-label-md text-label-md text-primary font-semibold hover:underline" href="#">
        Quên mật khẩu?
      </a>
</div>
<button class="w-full h-12 mt-space-sm bg-primary-container text-on-primary font-title-sm text-title-sm rounded-lg shadow-sm hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs" type="submit">
<span>Đăng nhập</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-space-xl pt-space-md text-center bg-surface-container-low rounded-lg p-space-sm">
<p class="font-label-md text-label-md text-on-surface-variant">
      Chưa có tài khoản học tập? 
      <a class="text-primary font-semibold hover:underline ml-1" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('studentPassword');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
