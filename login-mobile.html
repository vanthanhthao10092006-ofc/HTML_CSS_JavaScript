<!DOCTYPE html>

<html lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#0053db", "primary-fixed-dim": "#b4c5ff", "surface-bright": "#faf8ff", "surface-container-high": "#e2e7ff", "background": "#faf8ff", "tertiary": "#006242", "error-container": "#ffdad6", "secondary-fixed-dim": "#6bd8cb", "primary-container": "#2563eb", "on-error-container": "#93000a", "surface-container-low": "#f2f3ff", "tertiary-container": "#007d55", "surface-variant": "#dae2fd", "inverse-surface": "#283044", "on-secondary": "#ffffff", "tertiary-fixed": "#6ffbbe", "on-tertiary-fixed": "#002113", "on-primary-fixed-variant": "#003ea8", "on-tertiary": "#ffffff", "primary": "#004ac6", "secondary-fixed": "#89f5e7", "on-secondary-container": "#006f66", "surface-container-lowest": "#ffffff", "on-surface-variant": "#434655", "on-secondary-fixed": "#00201d", "outline-variant": "#c3c6d7", "error": "#ba1a1a", "on-primary-container": "#eeefff", "surface-container": "#eaedff", "on-primary": "#ffffff", "inverse-on-surface": "#eef0ff", "on-primary-fixed": "#00174b", "secondary-container": "#86f2e4", "inverse-primary": "#b4c5ff", "on-tertiary-container": "#bdffdb", "on-tertiary-fixed-variant": "#005236", "primary-fixed": "#dbe1ff", "secondary": "#006a61", "surface-dim": "#d2d9f4", "on-surface": "#131b2e", "on-secondary-fixed-variant": "#005049", "outline": "#737686", "surface-container-highest": "#dae2fd", "on-background": "#131b2e", "tertiary-fixed-dim": "#4edea3", "on-error": "#ffffff", "surface": "#faf8ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "space-xl": "2rem", "space-md": "0.75rem", "margin": "1rem", "space-lg": "1.25rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "margin-desktop": "2rem" }, fontFamily: { "headline-xl-mobile": ["Be Vietnam Pro"], "headline-lg": ["Be Vietnam Pro"], "label-md": ["Be Vietnam Pro"], "title-sm": ["Be Vietnam Pro"], "body-md": ["Be Vietnam Pro"], "headline-xl": ["Be Vietnam Pro"], "headline-md": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "body-lg": ["Be Vietnam Pro"] }, fontSize: { "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "title-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface px-margin py-space-lg flex-1"><div class="flex flex-col w-full max-w-[420px] mx-auto min-w-0">
<!-- Brand & Mascot Intro Card -->
<div class="flex flex-col items-center text-center pt-space-md pb-space-lg">
<div class="relative mb-space-md">
<div class="w-20 h-20 bg-surface-container-high rounded-full flex items-center justify-center shadow-sm">
<img alt="Logo Việc học của tôi" class="w-12 h-12 rounded-lg object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XpYXil13qg8eA2nPhEmoQvPgmZ2yjtFRtS6ppDwA-NSVZXWl7Xkw1UtoBWJiSLyC0CCQyoTefw8KDJBQi9ZOq5tPdHX9E3j49CHlbSrq5hJM_52QQEDoGenNHQxwdO5_FRdoE1pffVuSqHLquFuxEqh2IdVufbFggLkpS66r67I3vHWpnD2aPkB8TAdPIUupmzBP3rEmvSQ1orLESSN6wnM3pJ9TWHgZMc3F8eOTiexJw-w4FywtkMrrYu"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-tertiary-container text-on-tertiary-container w-7 h-7 rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px]">edit_note</span>
</div>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-space-xs tracking-tight">
      Việc học của tôi
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Đăng nhập để quản lý bài tập và tiến độ học tập mỗi ngày
    </p>
</div>
<!-- Main Login Card (Bento Minimal Surface) -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm mb-space-lg">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs text-left">
<label class="font-title-sm text-title-sm text-on-surface flex items-center justify-between" for="emailInput">
<span>Tài khoản Email</span>
<span class="font-label-sm text-label-sm text-outline font-normal">Học sinh / Sinh viên</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[22px]">
            alternate_email
          </span>
<input autocomplete="email" class="w-full h-12 pl-12 pr-space-md bg-surface-container-low text-on-surface placeholder:text-outline rounded-lg font-body-md text-body-md outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-200" id="emailInput" inputmode="email" name="email" placeholder="ban@truonghoc.edu.vn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs text-left">
<div class="flex justify-between items-center">
<label class="font-title-sm text-title-sm text-on-surface" for="passwordInput">
            Mật khẩu
          </label>
<a class="font-label-md text-label-md text-primary font-medium active:opacity-75" href="#">
            Quên mật khẩu?
          </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[22px]">
            lock
          </span>
<input autocomplete="current-password" class="w-full h-12 pl-12 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline rounded-lg font-body-md text-body-md outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-200" id="passwordInput" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Hiện hoặc ẩn mật khẩu" class="absolute right-space-xs w-11 h-11 flex items-center justify-center text-outline hover:text-on-surface active:scale-95 transition-transform" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input checked="" class="peer sr-only" id="rememberMe" type="checkbox"/>
<div class="w-6 h-6 rounded-lg bg-surface-container flex items-center justify-center text-transparent peer-checked:bg-primary peer-checked:text-on-primary transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant font-medium">Ghi nhớ đăng nhập</span>
</label>
</div>
<!-- Primary Action Button -->
<button class="w-full h-12 mt-space-sm bg-primary text-on-primary rounded-lg font-title-sm text-title-sm shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm group" id="submitBtn" type="submit">
<span>Đăng nhập ngay</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-0.5">
          arrow_forward
        </span>
</button>
<!-- Feedback Area -->
<div class="hidden rounded-lg p-space-md flex items-center gap-space-sm bg-surface-container-high text-on-surface" id="feedbackBox">
<span class="material-symbols-outlined text-[20px] text-primary" id="feedbackIcon">info</span>
<span class="font-body-md text-body-md" id="feedbackText"></span>
</div>
</form>
</div>
<!-- Warm Human Delight: Daily Study Tip Banner -->
<div class="bg-surface-container-low rounded-xl p-space-md flex items-start gap-space-md mb-space-xl">
<div class="w-10 h-10 rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[22px]">lightbulb</span>
</div>
<div class="flex flex-col text-left">
<span class="font-title-sm text-title-sm text-on-surface">Mẹo học vui hôm nay</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">
        Chia nhỏ bài tập thành từng phiên 25 phút giúp bạn tập trung và bớt áp lực hơn rất nhiều!
      </p>
</div>
</div>
<!-- Sign up alternative option -->
<div class="text-center py-space-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
      Chưa có tài khoản học tập? 
      <a class="font-title-sm text-title-sm text-primary underline underline-offset-4 ml-1 active:opacity-75" href="#">
        Tạo tài khoản mới
      </a>
</p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    var passwordInput = document.getElementById('passwordInput');
    var eyeIcon = document.getElementById('passwordEyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    var email = document.getElementById('emailInput').value;
    var feedbackBox = document.getElementById('feedbackBox');
    var feedbackText = document.getElementById('feedbackText');
    var feedbackIcon = document.getElementById('feedbackIcon');
    var submitBtn = document.getElementById('submitBtn');

    if (!feedbackBox || !feedbackText || !feedbackIcon || !submitBtn) return;

    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-80');
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Đang xử lý...</span>';

    setTimeout(function() {
      feedbackBox.classList.remove('hidden');
      feedbackBox.classList.add('flex');
      
      feedbackText.textContent = 'Chào mừng ' + (email.split('@')[0] || 'bạn') + ' quay trở lại bàn học!';
      feedbackIcon.textContent = 'task_alt';
      feedbackIcon.className = 'material-symbols-outlined text-[20px] text-tertiary';

      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-80');
      submitBtn.innerHTML = '<span>Đăng nhập thành công</span><span class="material-symbols-outlined text-[20px]">check</span>';
    }, 700);
  }
</script></main></body></html>
